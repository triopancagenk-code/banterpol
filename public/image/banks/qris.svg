<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 40" fill="none">
  <rect width="130" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <g transform="translate(12, 6)">
    <!-- QRIS Logo Icon: Stylized QR mini block -->
    <rect x="0" y="3" width="22" height="22" rx="4" fill="#EA1D25"/>
    <rect x="3" y="6" width="6" height="6" fill="#FFFFFF"/>
    <rect x="13" y="6" width="6" height="6" fill="#FFFFFF"/>
    <rect x="3" y="16" width="6" height="6" fill="#FFFFFF"/>
    <rect x="13" y="16" width="6" height="6" fill="#FFFFFF"/>
    <rect x="9" y="10" width="4" height="8" fill="#FFFFFF"/>
    <!-- QRIS Wordmark -->
    <text x="28" y="18" font-family="'Arial Black', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" fill="#EA1D25" letter-spacing="1">QRIS</text>
    <text x="29" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="6" font-weight="700" fill="#6B7280" letter-spacing="0.5">SCAN &amp; BAYAR</text>
  </g>
</svg>
